{% extends 'core/base.html' %}

{% block title %}Contact Us{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-2xl border border-gray-200 shadow-sm">
    <h1 class="text-3xl font-bold text-gray-900 mb-2">Contact Us</h1>
    <p class="text-gray-600 mb-6">Have questions or feedback? Send us a message below.</p>

    <form method="post" action="{% url 'contact' %}" class="space-y-5">
        {% csrf_token %}

        {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-gray-700 mb-1">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.errors %}
                    <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="w-full py-3 bg-teal-600 text-white font-bold rounded-xl hover:bg-teal-700 shadow-sm transition">
            Send Message
        </button>
    </form>
</div>
{% endblock %}
